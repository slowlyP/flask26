{% extends "layout.html" %}

{% block content %}

<h2>회원정보 수정</h2>

<form method="post" enctype="multipart/form-data">

    <div class="mb-3">
        <label>아이디</label>
        <input type="text"
               class="form-control"
               value="{{ member.uid }}"
               readonly>
    </div>

    <div class="mb-3">
        <label>비밀번호</label>
        <input type="password"
               name="upw"
               class="form-control"
               placeholder="변경 시만 입력">
                
    </div>

    <div class="mb-3">
        <label>이름</label>
        <input type="text"
               name="name"
               value="{{ member.name }}"
               class="form-control"
               required>
    </div>

    <div class="mb-3">
        <label>프로필 이미지</label>
        <input type="file"
               name="profile_img"
               class="form-control">
    </div>

    <button class="btn btn-primary">
        수정하기
    </button>

    <a href="/member/mypage"
       class="btn btn-secondary">
       취소
    </a>

</form>

{% endblock %}
