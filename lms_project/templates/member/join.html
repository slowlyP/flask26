{% extends "layout.html" %}

{% block content %}

<h2>회원가입</h2>

<form method="post">

    <div class="mb-3">
        <label>아이디</label>
        <input type="text" name="uid" class="form-control">
    </div>

    <div class="mb-3">
        <label>비밀번호</label>
        <input type="password" name="upw" class="form-control">
    </div>
    <div class="mb-3">
        <label>비밀번호 확인</label>
        <input type="password" name="upw_confirm"class="form-control"
               required>
    </div>

    <div class="mb-3">
        <label>이름</label>
        <input type="text" name="name" class="form-control">
    </div>

    <button class="btn btn-primary">
        회원가입
    </button>

</form>

{% endblock %}
